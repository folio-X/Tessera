# Tessera constituent registry — v1.0.0
#
# Each model has:
#   id            — stable identifier used in snapshots and CSV
#   display_name  — human-readable name for the website
#   provider      — pricing source (must match a scraper provider_name)
#   tier          — one of: frontier_closed, mid_tier_closed, open
#   added         — ISO date this model entered the index
#   pricing_url   — canonical public pricing page
#
# For OPEN-tier models, `hosts` lists the providers we collect prices from.
# Per-model price = median across these hosts.

models:
  # ----- Frontier Closed (TFC) -----
  - id: openai-gpt-5
    display_name: "GPT-5"
    provider: openai
    tier: frontier_closed
    added: 2026-05-04
    pricing_url: https://openai.com/api/pricing
    api_model_id: gpt-5

  - id: anthropic-claude-opus-4-7
    display_name: "Claude Opus 4.7"
    provider: anthropic
    tier: frontier_closed
    added: 2026-05-04
