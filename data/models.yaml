    api_model_id: claude-opus-4-7

  - id: google-gemini-2-5-pro
    display_name: "Gemini 2.5 Pro"
    provider: google
    tier: frontier_closed
    added: 2026-05-04
    pricing_url: https://ai.google.dev/pricing
