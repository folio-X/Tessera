# Notes:
# - input/output prices are not stored here; they live in the daily snapshot files
#   under data/snapshots/YYYY-MM-DD.json, sourced fresh each day by the scrapers.
# - Adding or removing a model requires 14 days' published notice except for
#   forced deprecations. See GOVERNANCE.md.
