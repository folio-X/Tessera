name: daily-update

# Runs at the Tessera fixing time (16:00 UTC) each day. The pipeline:
#   1. Runs every scraper in data/models.yaml.
#   2. Validates and computes the day's index.
#   3. Commits the new snapshot + appended CSV row to main.
#   4. If anything failed, opens an issue with the failure details.

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run daily pipeline
        id: pipeline
        run: |
          python -m tessera.cli daily-run 2>&1 | tee /tmp/run.log
        continue-on-error: true

      - name: Commit if changed
        if: steps.pipeline.outcome == 'success'
        run: |
          git config user.name "tessera-bot"
          git config user.email "tessera@foliox.ai"
          today=$(date -u +%Y-%m-%d)
          git add data/snapshots/*.json data/index/tessera-daily.csv
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: daily update ${today}"
            git push
          fi

      - name: Open issue on failure
        if: steps.pipeline.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/run.log', 'utf8').slice(-4000);
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `daily-update failed ${today}`,
              body: '```\n' + log + '\n```',
              labels: ['daily-update-failed'],
            });

      - name: Trigger website rebuild
        if: steps.pipeline.outcome == 'success' && secrets.WEBSITE_REBUILD_HOOK != ''
        run: |
          curl -X POST "${{ secrets.WEBSITE_REBUILD_HOOK }}"
