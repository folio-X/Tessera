[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tessera"
version = "0.1.0"
description = "Open-source, transparent index of AI inference costs across major LLM providers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "FolioX Inc.", email = "tessera@foliox.ai" }]
keywords = ["ai", "llm", "pricing", "index", "inference-cost"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "httpx>=0.27.0",
  "pyyaml>=6.0.1",
  "pydantic>=2.6.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.1.0",
  "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "types-PyYAML",
  "pre-commit>=3.7.0",
]

[project.scripts]
tessera = "tessera.cli:main"

[project.urls]
Homepage = "https://foliox.ai/tessera"
Repository = "https://github.com/folio-X/tessera"
Issues = "https://github.com/folio-X/tessera/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PT"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
